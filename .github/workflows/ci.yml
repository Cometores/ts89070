name: .NET CI

on:
  push:
    branches: 
      - master
  pull_request:
    branches: 
      - master

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
        
    - name: Restore dependencies
      run: dotnet restore CSV-API.sln
      
    - name: Build
      run: dotnet build CSV-API.sln --no-restore
      
    - name: Test
      run: dotnet test CSV-API.sln --no-build --verbosity normal
